<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电子表格融合工具 - 合并统计</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #f5f6fa;
  --card-bg: #ffffff;
  --primary: #4f6ef7;
  --primary-hover: #3b5de7;
  --danger: #e74c3c;
  --success: #27ae60;
  --warning: #f39c12;
  --text: #2c3e50;
  --text-light: #7f8c8d;
  --border: #e1e5eb;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 10px;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.container { max-width: 1300px; margin: 0 auto; padding: 24px 20px 60px; }

/* Header */
.header { text-align: center; padding: 28px 0 10px; }
.header h1 { font-size: 28px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
.header p { color: var(--text-light); font-size: 14px; }

/* Stats bar */
.stats-bar { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 16px 0 20px; }
.stat-card { background: var(--card-bg); border-radius: var(--radius); padding: 14px 22px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; min-width: 120px; }
.stat-card.total { border-left: 4px solid var(--danger); }
.stat-icon { font-size: 28px; }
.stat-info .stat-num { font-size: 24px; font-weight: 700; color: var(--primary); line-height: 1; }
.stat-card.total .stat-num { color: var(--danger); }
.stat-info .stat-label { font-size: 12px; color: var(--text-light); margin-top: 4px; }

/* Upload zone */
.upload-zone { background: var(--card-bg); border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px 24px; text-align: center; cursor: pointer; transition: all 0.25s; margin-bottom: 20px; box-shadow: var(--shadow); }
.upload-zone:hover, .upload-zone.dragover { border-color: var(--primary); background: #f0f3ff; }
.upload-zone .icon { font-size: 44px; margin-bottom: 10px; }
.upload-zone .title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.upload-zone .hint { font-size: 13px; color: var(--text-light); }
.upload-zone input { display: none; }

/* File list */
.file-list-section { background: var(--card-bg); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
.section-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.empty-state { text-align: center; padding: 32px; color: var(--text-light); font-size: 14px; }
.file-items { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; }
.file-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; transition: all 0.2s; }
.file-item:hover { border-color: var(--primary); }
.file-item .fidx { width: 28px; height: 28px; border-radius: 6px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
.file-item .finfo { flex:1; min-width:0; }
.file-item .fname { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-item .fmeta { font-size: 12px; color: var(--text-light); }
.file-item .fremove { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 18px; padding: 4px 8px; border-radius: 4px; transition: all 0.2s; flex-shrink: 0; }
.file-item .fremove:hover { background: #fde8e8; }
.file-item .fpreview { background: var(--primary); color: #fff; border: none; padding: 4px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; flex-shrink: 0; transition: all 0.2s; }
.file-item .fpreview:hover { background: var(--primary-hover); }

/* Merge controls */
.merge-controls { background: var(--card-bg); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
.action-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { padding: 10px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover:not(:disabled) { background: #219a52; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { background: var(--danger-hover); }
.btn-outline { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
.btn-outline:hover:not(:disabled) { background: #f0f3ff; }
.btn-merge { background: linear-gradient(135deg, var(--primary), #7c5cfc); color: #fff; font-size: 16px; padding: 12px 32px; }
.btn-merge:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(79,110,247,0.4); }

/* Result table */
.result-section { background: var(--card-bg); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
.result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 12px; }
.result-header h2 { font-size: 16px; font-weight: 600; }
.table-wrapper { overflow-x: auto; max-height: 520px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
thead { position: sticky; top: 0; z-index: 1; }
th { background: var(--primary); color: #fff; padding: 10px 14px; text-align: left; font-weight: 600; }
td { padding: 8px 14px; border-bottom: 1px solid var(--border); }
tr:nth-child(even) td { background: #f8f9fc; }
tr:hover td { background: #eef1ff; }

/* Statistics panel */
.stats-panel { background: var(--card-bg); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
.stats-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
.summary-card { background: linear-gradient(135deg, #f8f9fc, #eef1ff); border-radius: var(--radius); padding: 18px; border: 1px solid var(--border); }
.summary-card .sc-label { font-size: 13px; color: var(--text-light); margin-bottom: 6px; }
.summary-card .sc-value { font-size: 28px; font-weight: 700; color: var(--primary); }
.summary-card .sc-sub { font-size: 12px; color: var(--text-light); margin-top: 4px; }
.summary-card.highlight { background: linear-gradient(135deg, #fff5f5, #ffe8e8); border-color: #fcc; }
.summary-card.highlight .sc-value { color: var(--danger); }

.address-breakdown { margin-top: 10px; }
.address-breakdown h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.address-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.address-table th { background: #f0f3ff; color: var(--text); padding: 10px 14px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--primary); }
.address-table td { padding: 8px 14px; border-bottom: 1px solid var(--border); }
.address-table tr:hover td { background: #f8f9fc; }
.address-table .total-row td { font-weight: 700; border-top: 2px solid var(--primary); background: #f0f3ff; }

.column-select-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; padding: 12px; background: #f8f9fc; border-radius: 8px; }
.column-select-row label { font-size: 13px; font-weight: 500; white-space: nowrap; }
.column-select-row select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; min-width: 140px; }
.auto-badge { font-size: 11px; background: var(--success); color: #fff; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }

.column-info { padding: 10px 14px; margin-bottom: 12px; background: #f8f9fc; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; line-height: 2; }
.col-tag { display: inline-block; background: #e8ecf4; color: var(--text); padding: 2px 10px; border-radius: 12px; margin: 2px 4px; font-size: 12px; white-space: nowrap; }
.col-tag-source { background: #e0f0ff; color: #2b6cb0; font-weight: 600; }
.col-tag-addr { background: #fff0e6; color: #c05621; font-weight: 600; }
.col-tag-price { background: #ffe8e8; color: #c53030; font-weight: 600; }

/* Filter tabs */
.filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.filter-tab { padding: 8px 18px; border: 1.5px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 500; background: #fff; color: var(--text); transition: all 0.2s; white-space: nowrap; }
.filter-tab:hover { border-color: var(--primary); color: var(--primary); }
.filter-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.filter-tab .tab-count { font-size: 11px; opacity: 0.75; margin-left: 4px; }

/* Toast */
.toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); padding: 12px 28px; border-radius: 8px; color: #fff; font-weight: 500; font-size: 14px; z-index: 9999; box-shadow: 0 4px 20px rgba(0,0,0,0.2); animation: slideDown 0.35s ease; }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.info { background: var(--primary); }
@keyframes slideDown { from { opacity:0; transform:translateX(-50%) translateY(-20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 9998; animation: fadeIn 0.2s ease; }
.modal { background: #fff; border-radius: 12px; padding: 24px; max-width: 90vw; max-height: 85vh; overflow-y: auto; box-shadow: 0 8px 40px rgba(0,0,0,0.2); }
.modal h3 { margin-bottom: 14px; font-size: 16px; }
.modal-close { float: right; background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-light); padding: 0 6px; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

/* Export picker */
.export-picker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.export-pick-card { border: 2px solid var(--border); border-radius: 10px; padding: 16px; cursor: pointer; transition: all 0.2s; text-align: center; }
.export-pick-card:hover { border-color: var(--primary); background: #f0f3ff; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(79,110,247,0.15); }
.export-pick-card.all { grid-column: 1 / -1; background: linear-gradient(135deg, #f0f3ff, #e8ecff); border-color: var(--primary); }
.export-pick-card .epc-icon { font-size: 28px; margin-bottom: 6px; }
.export-pick-card .epc-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.export-pick-card .epc-meta { font-size: 12px; color: var(--text-light); }
.export-pick-card .epc-actions { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
.epc-btn { padding: 6px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.15s; }
.epc-btn.xlsx { background: var(--success); color: #fff; }
.epc-btn.xlsx:hover { background: #219a52; }
.epc-btn.csv { background: var(--text-light); color: #fff; }
.epc-btn.csv:hover { background: #5a6c7d; }
.epc-cancel { display: block; width: 100%; margin-top: 14px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; color: var(--text-light); transition: all 0.15s; }
.epc-cancel:hover { background: #f5f5f5; }

@media (max-width: 768px) {
  .container { padding: 12px 10px; }
  .stats-bar { gap: 8px; }
  .stat-card { padding: 10px 14px; min-width: 90px; }
  .action-buttons { flex-direction: column; }
  th, td { padding: 6px 8px; font-size: 12px; }
  .stats-summary { grid-template-columns: 1fr 1fr; }
  .column-select-row { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>📊 电子表格融合工具</h1>
    <p>上传多个 Excel / CSV 表格，原样合并为一个总表，自动统计地址和总价</p>
  </div>

  <!-- Top Stats -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-icon">📁</div>
      <div class="stat-info">
        <div class="stat-num" id="statFiles">0</div>
        <div class="stat-label">已加载表格</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📋</div>
      <div class="stat-info">
        <div class="stat-num" id="statTotalRows">0</div>
        <div class="stat-label">合并总行数</div>
      </div>
    </div>
    <div class="stat-card total">
      <div class="stat-icon">💰</div>
      <div class="stat-info">
        <div class="stat-num" id="statTotalPrice">¥0</div>
        <div class="stat-label">合计总价</div>
      </div>
    </div>
  </div>

  <!-- Upload Zone -->
  <div class="upload-zone" id="uploadZone">
    <div class="icon">📥</div>
    <div class="title">点击或拖拽上传电子表格</div>
    <div class="hint">支持 .xlsx、.xls、.csv，可一次选多个文件</div>
    <input type="file" id="fileInput" multiple accept=".xlsx,.xls,.csv">
  </div>

  <!-- File List -->
  <div class="file-list-section">
    <div class="section-title"><span>📑</span> 待合并表格</div>
    <div class="empty-state" id="emptyFileList">还没有添加表格，请先上传文件</div>
    <div class="file-items" id="fileList"></div>
  </div>

  <!-- Merge Controls -->
  <div class="merge-controls">
    <div class="section-title"><span>⚙️</span> 操作</div>
    <div class="action-buttons">
      <button class="btn btn-merge" id="btnMerge" disabled onclick="doMerge()">🔄 合并所有表格</button>
      <button class="btn btn-outline" id="btnAddMore" disabled onclick="document.getElementById('fileInput').click()">➕ 追加更多表格</button>
      <button class="btn btn-success" id="btnExport" disabled onclick="doExport()">📥 导出合并结果</button>
      <button class="btn btn-outline" id="btnPreview" disabled onclick="previewCurrent()">👁 预览</button>
      <button class="btn btn-danger" id="btnReset" disabled onclick="doReset()">🗑 清空重来</button>
    </div>
  </div>

  <!-- ============ STATISTICS PANEL ============ -->
  <div class="stats-panel" id="statsPanel" style="display:none;">
    <div class="result-header">
      <h2>📈 数据统计</h2>
    </div>

    <!-- Column auto-detect selectors -->
    <div class="column-select-row">
      <label>🏷️ 品类列：</label>
      <select id="catColumn" onchange="onCatColumnChange()"><option value="">-- 自动检测 --</option></select>
      <span class="auto-badge" id="catAutoBadge" style="display:none;">自动识别</span>
      <label style="margin-left:16px;">🏠 地址列：</label>
      <select id="addrColumn" onchange="recalcStats()"><option value="">-- 自动检测 --</option></select>
      <span class="auto-badge" id="addrAutoBadge" style="display:none;">自动识别</span>
      <label style="margin-left:16px;">💰 价格列：</label>
      <select id="priceColumn" onchange="recalcStats()"><option value="">-- 自动检测 --</option></select>
      <span class="auto-badge" id="priceAutoBadge" style="display:none;">自动识别</span>
    </div>

    <!-- Category filter tabs -->
    <div class="filter-tabs" id="filterTabs" style="display:none;">
      <button class="filter-tab active" data-cat="__all__" onclick="setFilter('__all__')">📋 全部</button>
    </div>

    <!-- Summary cards -->
    <div class="stats-summary" id="statsSummary"></div>

    <!-- Address breakdown table -->
    <div class="address-breakdown" id="addressBreakdown" style="display:none;">
      <h3>📍 按地址汇总</h3>
      <div class="table-wrapper" style="max-height:400px;">
        <table class="address-table" id="addressTable"></table>
      </div>
    </div>
  </div>

  <!-- ============ MERGED DATA TABLE ============ -->
  <div class="result-section" id="resultSection" style="display:none;">
    <div class="result-header">
      <h2>📊 <span id="resultTitle">合并结果</span></h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-outline" onclick="doExport()">📥 导出 Excel</button>
        <button class="btn btn-outline" onclick="doExportCSV()">📄 导出 CSV</button>
      </div>
    </div>
    <div class="column-info" id="columnInfo" style="display:none;"></div>
    <div class="table-wrapper" id="tableWrapper"></div>
  </div>
</div>

<!-- Toast container -->
<div id="toastContainer"></div>

<!-- Preview Modal -->
<div class="modal-overlay" id="previewModal" style="display:none;" onclick="if(event.target===this) closePreview()">
  <div class="modal">
    <button class="modal-close" onclick="closePreview()">✕</button>
    <h3 id="previewTitle">表格预览</h3>
    <div class="table-wrapper"><table id="previewTable"></table></div>
  </div>
</div>

<!-- Export Picker Modal -->
<div class="modal-overlay" id="exportPickerModal" style="display:none;" onclick="if(event.target===this) closeExportPicker()">
  <div class="modal" style="min-width:420px;">
    <button class="modal-close" onclick="closeExportPicker()">✕</button>
    <h3>📥 选择导出货表</h3>
    <div class="export-picker-grid" id="exportPickerGrid"></div>
    <button class="epc-cancel" onclick="closeExportPicker()">取消</button>
  </div>
</div>

<script>
/* ============ XLSX availability check ============ */
if (typeof XLSX === 'undefined') {
  document.getElementById('uploadZone').innerHTML = `
    <div class="icon">⚠️</div>
    <div class="title">核心库加载失败</div>
    <div class="hint">XLSX 解析库未成功加载，请刷新页面或检查网络连接后重试</div>
  `;
  document.getElementById('uploadZone').style.borderColor = 'var(--danger)';
  document.getElementById('uploadZone').style.cursor = 'not-allowed';
}

/* ============ Helpers ============ */
function cleanHeader(str) {
  // Remove all kinds of invisible whitespace: NBSP, zero-width, etc.
  return String(str == null ? '' : str)
    .replace(/[\u00A0\u1680\u2000-\u200F\u2028\u2029\u202F\u205F\u3000\uFEFF]/g, ' ')
    .trim();
}

/* ============ Global State ============ */
const state = {
  files: [],
  mergedData: null,     // { headers, rows }
  catFilter: '__all__', // current category filter
  importedNames: new Set(), // track all imported file names to prevent duplicates
};

/* ============ Toast ============ */
function toast(msg, type='info') {
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 2500);
}

/* ============ Upload ============ */
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => handleFiles(e.target.files));

function handleFiles(fileList) {
  // Check XLSX library availability
  if (typeof XLSX === 'undefined') {
    toast('XLSX 库加载失败，请刷新页面后重试', 'error');
    return;
  }

  const validExts = ['.xlsx','.xls','.csv'];
  const files = Array.from(fileList);

  // Check for duplicate file names (among queued + already imported + currently in state)
  const allKnownNames = new Set([
    ...state.importedNames,
    ...state.files.map(f => f.name),
  ]);

  // Filter invalid files & duplicates
  const valid = [];
  const duplicates = [];
  files.forEach(f => {
    const ext = '.' + f.name.split('.').pop().toLowerCase();
    if (!validExts.includes(ext)) {
      toast(`跳过不支持的文件: ${f.name}`, 'error');
      return;
    }
    if (allKnownNames.has(f.name)) {
      duplicates.push(f.name);
      return;
    }
    allKnownNames.add(f.name);
    valid.push(f);
  });

  if (duplicates.length > 0) {
    toast(`已跳过 ${duplicates.length} 个重复文件: ${duplicates.join('、')}`, 'info');
  }
  if (valid.length === 0) { fileInput.value = ''; return; }

  // Show loading state
  const btnMerge = document.getElementById('btnMerge');
  btnMerge.disabled = true;
  btnMerge.innerHTML = '⏳ 解析中...';

  // Read all files — detect HTML-pretend .xls vs real xlsx/xls/csv
  const promises = valid.map(file => new Promise((resolve) => {
    // First read as text to detect HTML format
    const textReader = new FileReader();
    textReader.onload = te => {
      const text = te.target.result;
      // Detect if this is actually an HTML file saved as .xls
      if (/^\s*</.test(text) && /<table/i.test(text) && /<html/i.test(text)) {
        // HTML-pretend .xls — parse metadata + table manually
        try {
          const parser = new DOMParser();
          const doc = parser.parseFromString(text, 'text/html');

          // Extract address from .addr div or similar
          let address = '';
          const addrEl = doc.querySelector('.addr');
          if (addrEl) {
            // Get text after the label span
            const labelSpan = addrEl.querySelector('.info-label');
            if (labelSpan) labelSpan.remove();
            address = cleanHeader(addrEl.textContent);
          }

          // Extract order time from .info div
          let orderTime = '';
          const infoEls = doc.querySelectorAll('.info');
          infoEls.forEach(el => {
            const txt = el.textContent.replace(/^\s*[^：:]*[：:]\s*/, '').trim();
            if (/时间|日期|date/i.test(el.textContent)) orderTime = txt;
          });

          // Also try to get other metadata fields
          const metaFields = {};
          doc.querySelectorAll('.info').forEach(el => {
            const label = el.querySelector('.info-label');
            if (label) {
              // Strip trailing colon from key (e.g. "订单时间：" → "订单时间")
              const rawKey = cleanHeader(label.textContent);
              const key = rawKey.replace(/[：:]\s*$/, '');
              const val = cleanHeader(el.textContent.replace(label.textContent, ''));
              if (key && val && key !== '收货地址' && key !== '订单时间' && key !== '地址') metaFields[key] = val;
            }
          });

          // Parse the table
          const table = doc.querySelector('table');
          if (!table) { toast(`${file.name}: HTML 文件中未找到表格`, 'error'); resolve(null); return; }

          const headers = [];
          const rows = [];
          const headerRow = table.querySelector('thead tr, tr:first-child');
          if (headerRow) {
            headerRow.querySelectorAll('th, td').forEach(cell => {
              headers.push(cleanHeader(cell.textContent));
            });
          }

          // Read data rows (skip header row and total/合计 rows)
          const allTrs = table.querySelectorAll('tbody tr, tr');
          let headerSkipped = false;
          allTrs.forEach(tr => {
            if (!headerSkipped) { headerSkipped = true; return; }
            const cells = tr.querySelectorAll('th, td');
            if (cells.length === 0) return;
            // Skip total/footer rows
            const firstCell = cleanHeader(cells[0].textContent);
            if (/合计|总计|total/i.test(firstCell)) return;
            const row = [];
            cells.forEach(c => row.push(cleanHeader(c.textContent)));
            rows.push(row);
          });

          if (headers.length === 0 || rows.length === 0) {
            toast(`${file.name}: 未解析到有效表格数据`, 'error');
            resolve(null);
            return;
          }

          // Build final: table columns FIRST, then address + time at end
          const finalHeaders = [...headers];
          if (address) finalHeaders.push('收货地址');
          if (orderTime) finalHeaders.push('订单时间');
          Object.keys(metaFields).forEach(k => finalHeaders.push(k));

          const finalRows = rows.map(row => {
            const newRow = [...row];
            if (address) newRow.push(address);
            if (orderTime) newRow.push(orderTime);
            Object.keys(metaFields).forEach(k => newRow.push(metaFields[k]));
            return newRow;
          });

          resolve({ name: file.name, headers: finalHeaders, data: finalRows });
        } catch(err) {
          toast(`HTML 解析失败: ${file.name} — ${err.message}`, 'error');
          resolve(null);
        }
        return;
      }

      // Not HTML — read as arraybuffer for SheetJS
      const binReader = new FileReader();
      binReader.onload = be => {
        try {
          const wb = XLSX.read(be.target.result, { type: 'array' });
          const sheetName = wb.SheetNames[0];
          if (!sheetName) { toast(`${file.name}: 工作簿中没有工作表`, 'error'); resolve(null); return; }
          const ws = wb.Sheets[sheetName];
          const jsonData = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
          if (!jsonData || jsonData.length < 2) {
            toast(`${file.name}: 数据行太少（需至少 1 行表头 + 1 行数据）`, 'error');
            resolve(null);
            return;
          }
          resolve({
            name: file.name,
            headers: jsonData[0].map(h => cleanHeader(h)),
            data: jsonData.slice(1).filter(row => row.some(c => cleanHeader(c) !== '')),
          });
        } catch(err) {
          toast(`解析失败: ${file.name} — ${err.message}`, 'error');
          resolve(null);
        }
      };
      binReader.onerror = () => {
        toast(`读取失败: ${file.name}（文件可能已损坏）`, 'error');
        resolve(null);
      };
      binReader.readAsArrayBuffer(file);
    };
    textReader.onerror = () => {
      toast(`读取失败: ${file.name}（文件可能已损坏）`, 'error');
      resolve(null);
    };
    textReader.readAsText(file);
  }));

  // Wait for all files, then update state
  Promise.all(promises).then(results => {
    const loaded = results.filter(r => r !== null);
    loaded.forEach(f => {
      state.files.push(f);
      state.importedNames.add(f.name);
    });
    refreshUI();
    btnMerge.innerHTML = '🔄 合并所有表格';
    btnMerge.disabled = state.files.length < 2;
    if (loaded.length > 0) {
      toast(`成功加载 ${loaded.length} 个文件`, 'success');
    } else if (valid.length > 0) {
      toast('所有文件解析均失败，请检查文件格式', 'error');
    }
    fileInput.value = '';
  }).catch(err => {
    toast('文件处理异常: ' + err.message, 'error');
    btnMerge.innerHTML = '🔄 合并所有表格';
    btnMerge.disabled = state.files.length < 2;
    fileInput.value = '';
  });
}

/* ============ UI Refresh ============ */
function refreshUI() {
  const fl = document.getElementById('fileList');
  const empty = document.getElementById('emptyFileList');

  if (state.files.length === 0) {
    fl.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    fl.innerHTML = state.files.map((f, i) => `
      <div class="file-item">
        <div class="fidx">${i + 1}</div>
        <div class="finfo">
          <div class="fname">${f.name}</div>
          <div class="fmeta">${f.data.length} 行 × ${f.headers.length} 列 | 列名: ${f.headers.slice(0,5).join(', ')}${f.headers.length>5?'...':''}</div>
        </div>
        <button class="fpreview" onclick="previewFile(${i})">预览</button>
        <button class="fremove" onclick="removeFile(${i})" title="移除">✕</button>
      </div>
    `).join('');
  }

  // Stats
  const hasMerge = state.mergedData !== null;
  const totalRows = hasMerge ? state.mergedData.rows.length : state.files.reduce((s,f) => s + f.data.length, 0);
  document.getElementById('statFiles').textContent = state.files.length;
  document.getElementById('statTotalRows').textContent = totalRows;

  document.getElementById('btnMerge').disabled = state.files.length < 2 && !hasMerge;
  document.getElementById('btnAddMore').disabled = !hasMerge;
  document.getElementById('btnExport').disabled = !hasMerge;
  document.getElementById('btnPreview').disabled = !hasMerge;
  document.getElementById('btnReset').disabled = !hasMerge && state.files.length === 0;
}

/* ============ Column Auto-Detection ============ */
const ADDR_KEYWORDS = ['地址', '地点', '位置', '收货地址', '发货地址', '详细地址', 'address', 'addr', 'location'];
const PRICE_KEYWORDS = ['价格', '单价', '金额', '总价', '费用', '售价', '成本', 'price', 'amount', 'cost', '总计', '合计', '小计'];
const CAT_KEYWORDS = ['品类', '类型', '分类', '产品类型', '产品名称', '名称', '品名', '物料名称', 'category', 'type'];

function detectColumn(headers, keywords) {
  // exact match first
  for (const kw of keywords) {
    const idx = headers.findIndex(h => h === kw);
    if (idx >= 0) return { idx, name: headers[idx] };
  }
  // contains match
  for (const kw of keywords) {
    const idx = headers.findIndex(h => h.includes(kw));
    if (idx >= 0) return { idx, name: headers[idx] };
  }
  return null;
}

function getDetectedAddrCol() {
  if (!state.mergedData) return null;
  return detectColumn(state.mergedData.headers, ADDR_KEYWORDS);
}

function getDetectedPriceCol() {
  if (!state.mergedData) return null;
  return detectColumn(state.mergedData.headers, PRICE_KEYWORDS);
}

function getDetectedCatCol() {
  if (!state.mergedData) return null;
  return detectColumn(state.mergedData.headers, CAT_KEYWORDS);
}

/* ============ Parse Price ============ */
function parsePrice(val) {
  if (val === undefined || val === null || val === '') return NaN;
  const s = String(val).replace(/[¥￥,，\s]/g, '').trim();
  const n = parseFloat(s);
  return isNaN(n) ? NaN : n;
}

function formatPrice(n) {
  return '¥' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

/* ============ Statistics ============ */
function recalcStats() {
  if (!state.mergedData) return;

  const headers = state.mergedData.headers;
  const allRows = state.mergedData.rows;

  // Determine category column
  const catSel = document.getElementById('catColumn').value;
  const autoCat = getDetectedCatCol();
  const catCol = catSel ? { idx: headers.indexOf(catSel), name: catSel } : autoCat;

  // Determine address column
  const addrSel = document.getElementById('addrColumn').value;
  const autoAddr = getDetectedAddrCol();
  const addrCol = addrSel ? { idx: headers.indexOf(addrSel), name: addrSel } : autoAddr;

  // Determine price column
  const priceSel = document.getElementById('priceColumn').value;
  const autoPrice = getDetectedPriceCol();
  const priceCol = priceSel ? { idx: headers.indexOf(priceSel), name: priceSel } : autoPrice;

  // Update badges
  document.getElementById('catAutoBadge').style.display = !catSel && autoCat ? 'inline' : 'none';
  document.getElementById('addrAutoBadge').style.display = !addrSel && autoAddr ? 'inline' : 'none';
  document.getElementById('priceAutoBadge').style.display = !priceSel && autoPrice ? 'inline' : 'none';

  // Filter rows by selected category
  let rows = allRows;
  if (state.catFilter !== '__all__' && catCol && catCol.idx >= 0) {
    rows = allRows.filter(row => cleanHeader(row[catCol.idx] || '') === state.catFilter);
  }

  // Calculate totals
  let totalPrice = 0;
  let priceCount = 0;
  const addrMap = {}; // address -> { count, total }

  rows.forEach(row => {
    if (priceCol && priceCol.idx >= 0) {
      const p = parsePrice(row[priceCol.idx]);
      if (!isNaN(p)) {
        totalPrice += p;
        priceCount++;
        if (addrCol && addrCol.idx >= 0) {
          const addr = cleanHeader(row[addrCol.idx] || '(空)');
          if (!addrMap[addr]) addrMap[addr] = { count: 0, total: 0 };
          addrMap[addr].count++;
          addrMap[addr].total += p;
        }
      }
    }
  });

  // Update top stat
  document.getElementById('statTotalPrice').textContent = formatPrice(totalPrice);

  // Render summary cards
  const summaryDiv = document.getElementById('statsSummary');
  let summaryHTML = '';
  const filterLabel = state.catFilter !== '__all__' ? `（${state.catFilter}）` : '';
  summaryHTML += `<div class="summary-card highlight"><div class="sc-label">💰 总价合计${filterLabel}</div><div class="sc-value">${formatPrice(totalPrice)}</div><div class="sc-sub">共 ${priceCount} 条有价格记录</div></div>`;
  summaryHTML += `<div class="summary-card"><div class="sc-label">📋 行数${filterLabel}</div><div class="sc-value">${rows.length}</div><div class="sc-sub">${headers.length} 列</div></div>`;
  if (addrCol) {
    const addrCount = Object.keys(addrMap).length;
    summaryHTML += `<div class="summary-card"><div class="sc-label">🏠 地址数</div><div class="sc-value">${addrCount}</div><div class="sc-sub">已自动识别地址列: ${addrCol.name}</div></div>`;
  }
  if (priceCol && priceCount > 0) {
    summaryHTML += `<div class="summary-card"><div class="sc-label">📦 有价记录数</div><div class="sc-value">${priceCount}</div><div class="sc-sub">已自动识别价格列: ${priceCol.name}</div></div>`;
  }
  summaryDiv.innerHTML = summaryHTML;

  // Address breakdown table
  const breakdown = document.getElementById('addressBreakdown');
  const addrTable = document.getElementById('addressTable');
  if (addrCol && Object.keys(addrMap).length > 0) {
    breakdown.style.display = 'block';
    const sortedAddrs = Object.entries(addrMap).sort((a, b) => b[1].total - a[1].total);
    let tableHTML = '<thead><tr><th>序号</th><th>地址</th><th style="text-align:right;">记录数</th><th style="text-align:right;">小计金额</th><th style="text-align:right;">占比</th></tr></thead><tbody>';
    sortedAddrs.forEach(([addr, info], i) => {
      const pct = totalPrice > 0 ? (info.total / totalPrice * 100).toFixed(1) : '0.0';
      tableHTML += `<tr>
        <td>${i + 1}</td>
        <td>${addr}</td>
        <td style="text-align:right;">${info.count}</td>
        <td style="text-align:right;font-weight:600;">${formatPrice(info.total)}</td>
        <td style="text-align:right;">${pct}%</td>
      </tr>`;
    });
    tableHTML += `<tr class="total-row"><td colspan="2">合计</td><td style="text-align:right;">${priceCount}</td><td style="text-align:right;">${formatPrice(totalPrice)}</td><td style="text-align:right;">100%</td></tr>`;
    tableHTML += '</tbody>';
    addrTable.innerHTML = tableHTML;
  } else {
    breakdown.style.display = 'none';
  }
}

/* ============ Category Filter ============ */
function onCatColumnChange() {
  state.catFilter = '__all__';
  populateFilterTabs();
  recalcStats();
}

function setFilter(cat) {
  state.catFilter = cat;
  document.querySelectorAll('.filter-tab').forEach(t => {
    t.classList.remove('active');
    if (t.getAttribute('data-cat') === cat) t.classList.add('active');
  });
  recalcStats();
}

function getCatCol() {
  if (!state.mergedData) return null;
  const headers = state.mergedData.headers;
  const catSel = document.getElementById('catColumn').value;
  const autoCat = getDetectedCatCol();
  return catSel ? { idx: headers.indexOf(catSel), name: catSel } : autoCat;
}

function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function populateFilterTabs() {
  if (!state.mergedData) return;
  const catCol = getCatCol();
  const tabsDiv = document.getElementById('filterTabs');
  if (!catCol || catCol.idx < 0) { tabsDiv.style.display = 'none'; return; }

  // Count rows per category
  const catCounts = {};
  state.mergedData.rows.forEach(row => {
    const val = cleanHeader(row[catCol.idx] || '(未分类)');
    catCounts[val] = (catCounts[val] || 0) + 1;
  });

  const totalAll = state.mergedData.rows.length;
  let tabsHTML = `<button class="filter-tab ${state.catFilter === '__all__' ? 'active' : ''}" data-cat="__all__" onclick="setFilter('__all__')">📋 全部<span class="tab-count">${totalAll}</span></button>`;

  const sorted = Object.entries(catCounts).sort((a, b) => b[1] - a[1]);
  sorted.forEach(([name, count]) => {
    const displayName = escapeHtml(name);
    const attrName = name.replace(/"/g, '&quot;').replace(/'/g, "&#39;");
    const jsName = name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    tabsHTML += `<button class="filter-tab ${state.catFilter === name ? 'active' : ''}" data-cat="${attrName}" onclick="setFilter('${jsName}')">${displayName}<span class="tab-count">${count}</span></button>`;
  });

  tabsDiv.innerHTML = tabsHTML;
  tabsDiv.style.display = 'flex';
}

/* ============ Populate Column Selectors ============ */
function populateColumnSelectors() {
  const headers = state.mergedData ? state.mergedData.headers : [];
  const catSel = document.getElementById('catColumn');
  const addrSel = document.getElementById('addrColumn');
  const priceSel = document.getElementById('priceColumn');
  const autoCat = getDetectedCatCol();
  const autoAddr = getDetectedAddrCol();
  const autoPrice = getDetectedPriceCol();

  const options = '<option value="">-- 自动检测 --</option>' + headers.map(h => `<option value="${h}">${h}</option>`).join('');

  catSel.innerHTML = options;
  addrSel.innerHTML = options;
  priceSel.innerHTML = options;

  if (autoCat) catSel.value = autoCat.name;
  if (autoAddr) addrSel.value = autoAddr.name;
  if (autoPrice) priceSel.value = autoPrice.name;

  // Populate filter tabs
  populateFilterTabs();
}

/* ============ Merge ============ */
function doMerge() {
  if (state.files.length < 2 && !state.mergedData) {
    toast('至少需要 2 个表格才能合并', 'error');
    return;
  }

  if (state.mergedData && state.files.length > 0) {
    // Append new files to existing merged data
    appendToMerged();
    return;
  }

  // First merge: collect all headers, then prioritize key columns after '来源文件'
  const allCols = new Set();
  state.files.forEach(f => {
    f.headers.forEach(h => allCols.add(cleanHeader(h)));
  });

  // Build ordered header list: 来源文件 → 收货地址 → 订单时间 → rest
  const priorityCols = ['收货地址', '订单时间'];
  const allHeaders = ['来源文件'];
  priorityCols.forEach(pc => {
    if (allCols.has(pc)) { allHeaders.push(pc); allCols.delete(pc); }
  });
  allCols.forEach(h => allHeaders.push(h));

  const allRows = [];
  state.files.forEach(f => {
    f.data.forEach(row => {
      const newRow = new Array(allHeaders.length).fill('');
      newRow[0] = f.name; // record source file
      for (let ti = 1; ti < allHeaders.length; ti++) {
        const th = allHeaders[ti];
        const si = f.headers.indexOf(th);
        if (si >= 0 && row[si] !== undefined && row[si] !== null) {
          newRow[ti] = row[si];
        }
      }
      allRows.push(newRow);
    });
  });

  state.mergedData = { headers: allHeaders, rows: allRows };
  state.files = [];
  toast(`合并完成！共 ${allRows.length} 行 × ${allHeaders.length} 列`, 'success');
  refreshUI();
  renderResult();
  populateColumnSelectors();
  recalcStats();
  document.getElementById('statsPanel').style.display = 'block';
}

function appendToMerged() {
  const existing = state.mergedData;
  state.files.forEach(f => {
    // Collect all unique headers
    const allCols = new Set(existing.headers.slice(1)); // skip '来源文件'
    f.headers.forEach(h => allCols.add(cleanHeader(h)));

    // Reorder: 来源文件 → 收货地址 → 订单时间 → rest
    const priorityCols = ['收货地址', '订单时间'];
    const newHeaders = ['来源文件'];
    priorityCols.forEach(pc => {
      if (allCols.has(pc)) { newHeaders.push(pc); allCols.delete(pc); }
    });
    allCols.forEach(h => newHeaders.push(h));

    const headerChanged = newHeaders.length !== existing.headers.length ||
      newHeaders.some((h, i) => h !== existing.headers[i]);

    if (headerChanged) {
      // Re-normalize existing rows to new header order
      const oldRows = existing.rows.map(row => {
        const newRow = new Array(newHeaders.length).fill('');
        newRow[0] = row[0]; // preserve source file
        for (let i = 1; i < existing.headers.length; i++) {
          const oldH = existing.headers[i];
          const newIdx = newHeaders.indexOf(oldH);
          if (newIdx >= 0) newRow[newIdx] = row[i];
        }
        return newRow;
      });
      existing.headers = newHeaders;
      existing.rows = oldRows;
    }

    // Append new rows, mapping by column name
    f.data.forEach(row => {
      const newRow = new Array(existing.headers.length).fill('');
      newRow[0] = f.name; // record source file
      for (let i = 1; i < existing.headers.length; i++) {
        const th = existing.headers[i];
        const si = f.headers.indexOf(th);
        if (si >= 0 && row[si] !== undefined && row[si] !== null) {
          newRow[i] = row[si];
        }
      }
      existing.rows.push(newRow);
    });
  });

  state.mergedData = existing;
  state.files = [];
  toast(`追加成功！当前共 ${existing.rows.length} 行`, 'success');
  refreshUI();
  renderResult();
  populateColumnSelectors();
  recalcStats();
}

/* ============ Remove File ============ */
function removeFile(idx) {
  const name = state.files[idx].name;
  state.files.splice(idx, 1);
  state.importedNames.delete(name);
  refreshUI();
  toast(`已移除: ${name}`, 'info');
}

/* ============ Preview ============ */
function previewFile(idx) {
  const f = state.files[idx];
  showPreviewModal(`${f.name} (${f.data.length} 行 × ${f.headers.length} 列)`, f.headers, f.data);
}

function previewCurrent() {
  if (!state.mergedData) return;
  showPreviewModal(`合并结果 (${state.mergedData.rows.length} 行 × ${state.mergedData.headers.length} 列)`, state.mergedData.headers, state.mergedData.rows);
}

function showPreviewModal(title, headers, data) {
  document.getElementById('previewTitle').textContent = title;
  const previewRows = data.slice(0, 100);
  const tbody = previewRows.map(row =>
    '<tr>' + row.map(c => `<td>${String(c)}</td>`).join('') + '</tr>'
  ).join('');
  document.getElementById('previewTable').innerHTML =
    '<thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>' + tbody + '</tbody>';
  if (data.length > 100) {
    document.getElementById('previewTable').querySelector('tbody').innerHTML +=
      `<tr><td colspan="${headers.length}" style="text-align:center;color:#999;">... 仅显示前 100 行，共 ${data.length} 行</td></tr>`;
  }
  document.getElementById('previewModal').style.display = 'flex';
}

function closePreview() {
  document.getElementById('previewModal').style.display = 'none';
}

/* ============ Render Result Table ============ */
function renderResult() {
  const section = document.getElementById('resultSection');
  const wrapper = document.getElementById('tableWrapper');
  if (!state.mergedData) { section.style.display = 'none'; return; }

  section.style.display = 'block';
  const d = state.mergedData;
  document.getElementById('resultTitle').textContent = `合并结果（${d.rows.length} 行 × ${d.headers.length} 列，原数据未做任何修改）`;

  // Show all detected columns
  const colInfo = document.getElementById('columnInfo');
  colInfo.innerHTML = '<strong>已检测到的列：</strong> ' + d.headers.map(h => {
    const display = h || '(空列名)';
    const isSource = h === '来源文件';
    const isAddr = /地址|收货|发货|地点|addr/i.test(h);
    const isPrice = /价格|金额|费用|售价|成本|price|amount|cost|总计|合计/i.test(h);
    let cls = 'col-tag';
    if (isSource) cls += ' col-tag-source';
    else if (isAddr) cls += ' col-tag-addr';
    else if (isPrice) cls += ' col-tag-price';
    return `<span class="${cls}">${display}</span>`;
  }).join(' ');
  colInfo.style.display = 'block';

  const displayRows = d.rows.slice(0, 200);
  let html = '<table><thead><tr>';
  html += '<th style="width:40px;text-align:center;">#</th>';
  html += d.headers.map(h => `<th>${h}</th>`).join('');
  html += '</tr></thead><tbody>';
  html += displayRows.map((row, i) =>
    `<tr><td style="text-align:center;color:var(--text-light);">${i+1}</td>` +
    row.map(c => `<td>${String(c)}</td>`).join('') + '</tr>'
  ).join('');
  html += '</tbody></table>';
  if (d.rows.length > 200) {
    html += '<div style="text-align:center;padding:12px;color:var(--text-light);">仅显示前 200 行，共 ' + d.rows.length + ' 行</div>';
  }
  wrapper.innerHTML = html;
  section.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

  { id: 'coffee',    label: '咖啡豆',         keywords: ['咖啡'],         icon: '☕' },
  { id: 'syrup',     label: '风味糖浆',       keywords: ['糖浆', '风味'], icon: '🍯' },
  { id: 'jam_tea',   label: '果酱和茶叶',     keywords: ['果酱', '茶'],   icon: '🍵' },
];

function countRowsForGroup(group) {
  if (!state.mergedData) return 0;
  if (group.id === '__all__') return state.mergedData.rows.length;
  const catCol = getCatCol();
  if (!catCol || catCol.idx < 0) return 0;
  return state.mergedData.rows.filter(row => {
    const val = String(row[catCol.idx] || '').toLowerCase();
    return group.keywords.some(kw => val.includes(kw));
  }).length;
}

function filterRowsByGroup(groupId) {
  if (!state.mergedData) return [];
  if (groupId === '__all__') return state.mergedData.rows;
  const group = EXPORT_GROUPS.find(g => g.id === groupId);
  if (!group) return [];
  const catCol = getCatCol();
  if (!catCol || catCol.idx < 0) return [];
  return state.mergedData.rows.filter(row => {
    const val = String(row[catCol.idx] || '').toLowerCase();
    return group.keywords.some(kw => val.includes(kw));
  });
}

function showExportPicker() {
  const grid = document.getElementById('exportPickerGrid');

  let html = '';
  EXPORT_GROUPS.forEach(group => {
    const count = countRowsForGroup(group);
    const isAll = group.id === '__all__';
    const cardClass = isAll ? 'export-pick-card all' : 'export-pick-card';
    html += `<div class="${cardClass}">
      <div class="epc-icon">${group.icon}</div>
      <div class="epc-name">${group.label}</div>
      <div class="epc-meta">${count} 条记录</div>
      <div class="epc-actions">
        <button class="epc-btn xlsx" data-export-group="${group.id}" data-export-type="xlsx">Excel</button>
        <button class="epc-btn csv" data-export-group="${group.id}" data-export-type="csv">CSV</button>
      </div>
    </div>`;
  });

  grid.innerHTML = html;

  // Event delegation — attach once, no inline onclick issues
  grid.onclick = function(e) {
    const btn = e.target.closest('.epc-btn');
    if (!btn) return;
    const groupId = btn.getAttribute('data-export-group');
    const type = btn.getAttribute('data-export-type');
    if (groupId && type) doFilteredExport(groupId, type);
  };

  document.getElementById('exportPickerModal').style.display = 'flex';
}

function closeExportPicker() {
  document.getElementById('exportPickerModal').style.display = 'none';
}

function doExport() {
  showExportPicker();
}

function doExportCSV() {
  showExportPicker();
}

function doFilteredExport(groupId, type) {
  if (!state.mergedData) return;
  closeExportPicker();

  const rows = filterRowsByGroup(groupId);
  if (rows.length === 0) { toast('该品类没有数据', 'error'); return; }

  // Build label for filename
  const group = EXPORT_GROUPS.find(g => g.id === groupId);
  const catLabel = group ? group.label : groupId;
  const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const ext = type === 'xlsx' ? '.xlsx' : '.csv';
  const defaultName = `${catLabel}_${dateStr}${ext}`;

  const filename = prompt('请输入导出文件名：', defaultName);
  if (!filename) return;
  const finalName = filename.endsWith(ext) ? filename : filename + ext;

  // Normalize: ensure every row matches headers length, blank missing cells
  const headers = state.mergedData.headers;
  const cleanRows = rows.map(row => {
    const r = new Array(headers.length).fill('');
    for (let i = 0; i < Math.min(row.length, headers.length); i++) {
      r[i] = (row[i] === undefined || row[i] === null) ? '' : row[i];
    }
    return r;
  });

  if (type === 'xlsx') {
    const ws = XLSX.utils.aoa_to_sheet([headers, ...cleanRows]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, catLabel);
    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = finalName;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } else {
    const csv = [headers, ...cleanRows]
      .map(row => row.map(c => {
        const s = String(c);
        return s.includes(',') || s.includes('"') || s.includes('\n') ? '"' + s.replace(/"/g,'""') + '"' : s;
      }).join(','))
      .join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = finalName; a.click();
    URL.revokeObjectURL(url);
  }

  toast(`导出成功: ${finalName}（${rows.length} 条记录）`, 'success');
}

/* ============ Reset ============ */
function doReset() {
  if (!confirm('确定要清空所有数据吗？此操作不可撤销！')) return;
  state.files = [];
  state.mergedData = null;
  state.catFilter = '__all__';
  state.importedNames = new Set();
  document.getElementById('resultSection').style.display = 'none';
  document.getElementById('statsPanel').style.display = 'none';
  document.getElementById('filterTabs').style.display = 'none';
  document.getElementById('tableWrapper').innerHTML = '';
  document.getElementById('columnInfo').style.display = 'none';
  document.getElementById('statTotalPrice').textContent = '¥0';
  refreshUI();
  toast('已清空所有数据', 'info');
}

/* ============ Init ============ */
refreshUI();
</script>
